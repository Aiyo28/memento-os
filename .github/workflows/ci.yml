name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly. The decay tests score against today's date, so this suite can go red
    # from the passage of time alone with no commit — as it did on 2026-06-14,
    # unnoticed for three months. A cron is the only thing that catches that class.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        run: bash tests/run.sh

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests tracked, valid, and consistent with the docs
        run: python3 scripts/check_manifests.py
