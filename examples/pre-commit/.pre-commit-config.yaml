# Example pre-commit config — wires memento:check as a local hook.
# Copy to the root of your project, adjust the entry path, then:
#   pre-commit install
#
# Lint runs on every commit that touches a _context.md file and fails the
# commit if any artifact violates the schema.

repos:
  - repo: local
    hooks:
      - id: memento-check
        name: memento:check
        entry: python3 .claude/plugins/memento-os/skills/check/lint.py
        language: system
        pass_filenames: false
        files: '_context\.md$'
        args: [--ci]
