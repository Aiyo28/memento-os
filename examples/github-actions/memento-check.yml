# Example GitHub Actions workflow — runs memento:check on every push and PR.
# Copy to .github/workflows/memento-check.yml and adjust the vault path.

name: memento:check

on:
  push:
    paths:
      - "**/_context.md"
      - ".claude/plugins/memento-os/**"
  pull_request:
    paths:
      - "**/_context.md"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run memento:check
        run: |
          python3 .claude/plugins/memento-os/skills/check/lint.py \
            --ci \
            "${GITHUB_WORKSPACE}/vault"
